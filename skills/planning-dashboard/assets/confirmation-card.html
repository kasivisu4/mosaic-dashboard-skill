<h2 class="sr-only">{{sr_summary}}</h2>
<div style="background: var(--surface-2); border-radius: 12px; border: 0.5px solid var(--border); padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 14px;">
  <div>
    <p style="font-size: 13px; color: var(--text-secondary); margin: 0 0 4px;">{{heading}}</p>
    <p style="font-size: 15px; line-height: 1.6; margin: 0;">{{read}}</p>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;">
{{chips}}
    </div>
  </div>
<!--section:unsure-->
  <p style="font-size: 13px; color: var(--text-secondary); margin: 0;"><i class="ti ti-help-circle" style="font-size: 16px; vertical-align: -3px; margin-right: 6px;" aria-hidden="true"></i>{{unsure}}</p>
<!--/section-->
  <div style="background: var(--surface-1); border-radius: var(--radius); padding: 12px;">
    <p style="font-size: 12px; color: var(--text-secondary); margin: 0 0 8px;">Layout preview</p>
{{wireframe}}
  </div>
  <div>
    <p style="font-size: 13px; color: var(--text-secondary); margin: 0 0 6px;">Assumptions</p>
{{assumptions}}
  </div>
<!--section:success-->
  <p style="font-size: 13px; margin: 0;"><i class="ti ti-target" style="font-size: 16px; vertical-align: -3px; margin-right: 6px; color: var(--text-secondary);" aria-hidden="true"></i><span style="color: var(--text-secondary);">Built for:</span> {{success}}</p>
<!--/section-->
<!--section:questions-->
  <div>
    <p style="font-size: 13px; color: var(--text-secondary); margin: 0 0 6px;">I'd also like to know</p>
    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
{{questions}}
    </div>
  </div>
<!--/section-->
  <div style="display: flex; gap: 8px; justify-content: flex-end; border-top: 0.5px solid var(--border); padding-top: 12px;">
{{actions}}
  </div>
</div>
<script>
document.querySelectorAll('[data-send]').forEach(function (b) { b.addEventListener('click', function () { sendPrompt(b.dataset.send); }); });
</script>
