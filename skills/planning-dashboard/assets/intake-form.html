<h2 class="sr-only">A short form asking what the dashboard is for, how often it will be used, who will look at it, and how much to check before building.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Dashboard details</span>
  </div>
  <div class="elicit-body">
<!--group:goal-->
    <div class="elicit-group">
      <label class="elicit-question">What should this dashboard help with? Pick one or two.</label>
      <div class="elicit-pills" data-name="goal" data-multi="true">
{{goal_cards}}
      </div>
    </div>
<!--/group-->
<!--group:cadence-->
    <div class="elicit-group">
      <label class="elicit-question">How often will it be used?</label>
      <div class="elicit-pills" data-name="cadence" data-multi="false">
{{cadence_pills}}
      </div>
    </div>
<!--/group-->
<!--group:request-->
    <div class="elicit-group">
      <label class="elicit-question">{{ask_label}}</label>
{{ask_pills}}
      <textarea class="elicit-textarea" data-name="request" placeholder="{{ph_request}}"></textarea>
    </div>
<!--/group-->
<!--group:success_criteria-->
    <div class="elicit-group">
      <label class="elicit-question">This dashboard is useful if…</label>
      <textarea class="elicit-textarea" data-name="success_criteria" placeholder="{{ph_success_criteria}}"></textarea>
    </div>
<!--/group-->
<!--group:data-->
    <div class="elicit-group">
      <label class="elicit-question">Where's the data?</label>
      <div class="elicit-files" data-name="data">
        <label class="elicit-dropzone">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M16.5 13a.5.5 0 0 1 .5.5v2a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15.5v-2a.5.5 0 0 1 1 0v2a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5v-2a.5.5 0 0 1 .5-.5M10 3a.5.5 0 0 1 .374.168l4 4.5.059.082a.5.5 0 0 1-.732.65l-.075-.068L10.5 4.814V13.5a.5.5 0 0 1-1 0V4.814L6.374 8.332a.5.5 0 0 1-.748-.664l4-4.5.08-.071A.5.5 0 0 1 10 3"/></svg>
          <span>Choose file</span>
          <input type="file" multiple>
        </label>
      </div>
      <textarea class="elicit-textarea" data-name="data_text" placeholder="{{ph_data_text}}"></textarea>
    </div>
<!--/group-->
<!--group:glossary-->
    <div class="elicit-group">
      <label class="elicit-question">Any terms with a specific meaning here?</label>
      <textarea class="elicit-textarea" data-name="glossary" placeholder="{{ph_glossary}}"></textarea>
    </div>
<!--/group-->
<!--group:audience-->
    <div class="elicit-group">
      <label class="elicit-question">Who will look at it?</label>
      <div class="elicit-pills" data-name="audience" data-multi="true">
{{audience_pills}}
      </div>
    </div>
<!--/group-->
<!--group:review_depth-->
    <div class="elicit-group">
      <label class="elicit-question">How much should I check with you before building?</label>
      <div class="elicit-pills" data-name="review_depth" data-multi="false">
{{review_depth_pills}}
      </div>
    </div>
<!--/group-->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Skip</button>
    <button type="button" class="elicit-submit">Continue</button>
  </div>
</form>
