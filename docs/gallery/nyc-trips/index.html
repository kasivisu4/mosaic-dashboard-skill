<!doctype html>
<html lang="en">
<head>
<script>try { if (!localStorage.getItem("motion")) localStorage.setItem("motion", "on"); } catch {}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A day of New York taxis</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.35.0/dist/tabler-icons.min.css">
<style>
:root {
  --bg: #ffffff; --panel: #f4f6f8; --ink: #111418; --muted: #5f6b78; --rule: #e3e7ec;
  --mark: #8794a1; --sel: #111418; --focus: #4269d0; --breach: #ff725c;
  --z0: #4269d0; --z1: #6cc5b0; --z2: #3ca951; --z3: #ff8ab7; --z4: #ff725c; --z5: #c48a00;
  --map-lo: #dfe7f5; --map-hi: #0b2a6b; --lens: #c48a00; --heat-lo: #e6ecf8; --heat-hi: #1d3f99;
  --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #181c22; --ink: #eef1f4; --muted: #9aa6b2; --rule: #2a3038;
    --mark: #7d8a97; --sel: #ffffff; --focus: #7b9cff; --breach: #ff8a75;
    --z0: #7b9cff; --z1: #6cc5b0; --z2: #5cc56f; --z3: #ff9cc4; --z4: #ff8a75; --z5: #f0c040;
    --map-lo: #2d4a7e; --map-hi: #e8f0ff; --lens: #f0c040; --heat-lo: #1b2333; --heat-hi: #9cb8ff;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #181c22; --ink: #eef1f4; --muted: #9aa6b2; --rule: #2a3038;
  --mark: #7d8a97; --sel: #ffffff; --focus: #7b9cff; --breach: #ff8a75;
  --z0: #7b9cff; --z1: #6cc5b0; --z2: #5cc56f; --z3: #ff9cc4; --z4: #ff8a75; --z5: #f0c040;
  --map-lo: #2d4a7e; --map-hi: #e8f0ff; --lens: #f0c040; --heat-lo: #1b2333; --heat-hi: #9cb8ff;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
:root { color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
body { overflow: hidden; }
button { font: inherit; color: inherit; }
.app { height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 18px; border-bottom: 1px solid var(--rule); }
header h1 { font-size: 20px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; }
.kpis { display: flex; gap: 20px; flex-wrap: wrap; }
.kpi { min-width: 104px; }
.kpi .lab { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.kpi .val { font-size: 22px; font-weight: 600; line-height: 1.15; }
.kpi .tot { font-size: 11.5px; color: var(--muted); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 10px; border-radius: 99px; background: var(--panel); border: 1px solid var(--rule); font-size: 12.5px; }
.chip button { border: 0; background: none; cursor: pointer; padding: 0 2px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--bg); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px; box-shadow: var(--shadow); }
.btn:hover { border-color: var(--muted); }
.btn[aria-pressed="true"] { background: var(--panel); }
.btn:disabled { opacity: .45; cursor: default; }
.hint { font-size: 11.5px; color: var(--muted); }
.info { color: var(--muted); cursor: help; font-size: 14px; }
.main { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; min-height: 0; }
.cards { overflow-y: auto; border-right: 1px solid var(--rule); padding: 30vh 18px 50vh; scroll-behavior: smooth; }
.card { padding: 14px 16px; margin: 0 0 22vh; border-radius: 12px; border: 1px solid var(--rule); background: var(--bg); cursor: pointer; opacity: .55; transition: opacity .3s, border-color .3s; }
.card.on { opacity: 1; border-color: var(--muted); box-shadow: var(--shadow); }
.card .act { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; letter-spacing: .02em; }
.card h3 { font-size: 15px; font-weight: 600; margin: 4px 0 6px; line-height: 1.35; }
.card p { margin: 0; color: var(--muted); font-size: 13px; }
.stagewrap { position: relative; display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; }
.stagehead { padding: 12px 20px 0; }
.stagehead h2 { margin: 0; min-height: 2.6em; font-size: 22px; font-weight: 600; line-height: 1.3; display: flex; gap: 8px; align-items: baseline; }
.stagehead .note { font-size: 12px; color: var(--muted); min-height: 18px; }
.stage { position: relative; min-height: 0; }
.stage canvas, .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage svg { touch-action: none; }
.transport { display: flex; align-items: center; gap: 8px; padding: 8px 20px 12px; flex-wrap: wrap; }
.hours { display: flex; gap: 2px; align-items: flex-end; margin-left: 8px; }
.hours button { width: 13px; height: 18px; border: 0; border-radius: 2px; background: var(--rule); cursor: pointer; padding: 0; }
.hours button.on { background: var(--sel); }
.hours button:focus-visible { outline: 2px solid var(--focus); }
.scenecount { margin-left: auto; font-size: 12px; color: var(--muted); }
#tip { position: fixed; pointer-events: none; z-index: 20; background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.14); max-width: 280px; opacity: 0; transition: opacity .12s; }
#tip b { font-weight: 600; }
#tip .m { color: var(--muted); }
.drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(440px, 100vw); background: var(--bg); border-left: 1px solid var(--rule); z-index: 30; padding: 18px 22px; overflow-y: auto; transform: translateX(100%); transition: transform .3s ease; box-shadow: -8px 0 24px rgba(0,0,0,.12); }
.drawer.open { transform: none; }
.drawer h3 { margin: 0 0 8px; font-size: 17px; }
.drawer li { margin-bottom: 6px; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); z-index: 5; background: var(--bg); }
.axis text, .guide text { fill: var(--muted); font-size: 11.5px; }
.guide .lab { fill: var(--ink); font-size: 12px; }
.guide .ann { fill: var(--ink); font-size: 12px; font-weight: 600; }
.guide .tick line { stroke: var(--rule); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 820px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100dvh; }
  .main { grid-template-columns: 1fr; grid-template-rows: 62dvh auto; }
  .stagewrap { order: -1; border-bottom: 1px solid var(--rule); }
  .cards { border-right: 0; padding: 12px 16px 30vh; max-height: 60dvh; }
  .card { margin-bottom: 14px; }
  .stagehead h2 { font-size: 17px; }
  .tools { margin-left: 0; }
  .hours { flex: 1 1 100%; margin-left: 0; }
  .hours button { flex: 1; width: auto; min-width: 0; }
  .stagehead h2 { min-height: 0; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><i class="ti ti-car" aria-hidden="true"></i>A day of New York taxis
      <i class="ti ti-info-circle info" tabindex="0" data-help="999,033 New York taxi trips: where they started, where they ended, the hour, distance and fare. The file has no dates, so every hour pools all the days in it. Open Notes for definitions."></i></h1>
    <div class="kpis" id="kpis"></div>
    <div class="tools">
      <span id="chips"></span>
      <button class="btn" id="reset" data-help="Clear the map box and the hour selection."><i class="ti ti-refresh" aria-hidden="true"></i>Reset</button>
      <button class="btn" id="motion" aria-pressed="true" data-help="Turn animation on or off. It starts from your system setting and is remembered in this browser.">Motion: on</button>
      <span class="hint" id="motionhint"></span>
      <button class="btn" id="notesbtn" data-help="Definitions, exclusions and how the page was made."><i class="ti ti-notes" aria-hidden="true"></i>Notes</button>
    </div>
  </header>
  <div class="main">
    <nav class="cards" id="cards" aria-label="Scenes"></nav>
    <section class="stagewrap" aria-live="polite">
      <div class="stagehead">
        <h2><i id="sceneicon" class="ti" aria-hidden="true"></i><span id="title"></span>
          <i class="ti ti-info-circle info" tabindex="0" id="titlehelp"></i></h2>
        <div class="note" id="note"></div>
      </div>
      <div class="stage" id="stage">
        <canvas id="map"></canvas>
        <svg id="svg" role="img" aria-labelledby="title"></svg>
        <div id="loading">Loading 999,033 trips into DuckDB in your browser…</div>
      </div>
      <div class="transport">
        <button class="btn" id="prev" aria-label="Previous scene" data-help="Previous scene (left arrow)."><i class="ti ti-player-track-prev" aria-hidden="true"></i></button>
        <button class="btn" id="next" aria-label="Next scene" data-help="Next scene (right arrow)."><i class="ti ti-player-track-next" aria-hidden="true"></i></button>
        <button class="btn" id="auto" aria-pressed="false" data-help="Step through the scenes on their own; any interaction pauses it (space bar)."><i class="ti ti-movie" aria-hidden="true"></i>Autoplay</button>
        <button class="btn" id="play" aria-pressed="false" data-help="Sweep a 3-hour window around the clock. Every scene, the map and the numbers follow it."><i class="ti ti-player-play" aria-hidden="true"></i>Play hours</button>
        <div class="hours" id="hours" role="group" aria-label="Hours of the day" data-help="The hour filter. Click an hour to filter every scene; shift-click adds hours."></div>
        <span class="scenecount" id="scenecount"></span>
      </div>
    </section>
  </div>
</div>
<div id="tip" role="tooltip"></div>
<aside class="drawer" id="drawer" aria-label="Notes">
  <button class="btn" id="closenotes" style="float:right"><i class="ti ti-x" aria-hidden="true"></i>Close</button>
  <h3>Notes</h3>
  <ul id="notes"></ul>
</aside>

<script type="module">
import * as vg from "https://cdn.jsdelivr.net/npm/@uwdata/vgplot@0.31.0/+esm";
import * as core from "https://cdn.jsdelivr.net/npm/@uwdata/mosaic-core@0.31.0/+esm";
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm";
import { polygons3D } from "https://cdn.jsdelivr.net/npm/d3-3d@1.0.0/+esm";

/* ---------- plan content (titles, captions, notes) ---------- */
const PLAN = {
  scenes: [
    { key: "map", act: "city", icon: "ti-map-pin", actName: "The city",
      title: "93.2% of 999,033 pickups start within 4 miles of Times Square",
      caption: "Every pickup in the file, binned to the pixel. Hover to look through the lens at where trips that start there end; drag a box to filter every scene.",
      help: "Pickups per 200 × 200 ft cell, on a log color scale. Rings mark 1, 2, 4 and 8 miles from Times Square. The share counts every trip in the file." },
    { key: "waffle-trips", act: "share", icon: "ti-layout-grid", actName: "Where the money is",
      title: "Of every 100 pickups, 3 start at JFK or LaGuardia",
      caption: "One square is 1% of the pickups in view, colored by where they start.",
      help: "Squares are rounded to whole percent with the largest-remainder method; hover a square for the exact share and count." },
    { key: "waffle-fares", act: "share", icon: "ti-coin", actName: "Where the money is",
      title: "Count dollars instead of trips and the airports take 8 of every 100",
      caption: "Same 100 squares, now 1% of fares each; squares change zone as the measure switches.",
      help: "Fares are the metered fare in USD summed over the trips in view, by pickup zone." },
    { key: "units-fares", act: "share", icon: "ti-list-details", actName: "Where the money is",
      title: "Airport pickups earn 2.9× their share of trips",
      caption: "Squares are fares; the outline on each row is that zone's share of trips.",
      help: "Each row is a pickup zone. Squares: 1% of fares each. Outline: the zone's exact share of trips. The ratio is fare share ÷ trip share." },
    { key: "clock", act: "clock", icon: "ti-clock-hour-12", actName: "Around the clock",
      title: "Midnight is the busiest hour: 67,964 trips, 4.7× the 6 a.m. low",
      caption: "The day as a clock: each wedge's length from the inner ring is the hour's trips. Click an hour to filter; Play sweeps the hand.",
      help: "Trips that started in each hour of the day, pooled over every day in the file. The inner ring is zero; length is linear." },
    { key: "miles", act: "clock", icon: "ti-ruler-measure", actName: "Around the clock",
      title: "6 a.m. trips are the longest: 4.64 miles on average, twice 7 p.m.'s 2.31",
      caption: "The dial unrolls: same 24 marks, now average trip length by starting hour.",
      help: "Average trip = total miles ÷ trips in that hour. Bars start at zero." },
    { key: "airport", act: "clock", icon: "ti-plane", actName: "Around the clock",
      title: "At 8 a.m., trips to or from an airport earn 32.8% of the hour's fares",
      caption: "Dot: airport share of the hour's fares. Tick: their share of the hour's trips.",
      help: "Airport trips start or end inside the JFK or LaGuardia box. Share of fares = their fares ÷ all fares in the hour." },
    { key: "heat", act: "terrain", icon: "ti-grid-dots", actName: "Two rhythms",
      title: "Within a mile of Times Square trips peak at 1 p.m.; 1–4 miles out they peak at midnight and 1 a.m.",
      caption: "Rows are zones, columns are hours, darker is more trips.",
      help: "Trips by pickup zone and starting hour. Color is linear in trips; see the legend." },
    { key: "terrain", act: "terrain", icon: "ti-mountain", actName: "Two rhythms",
      title: "The highest point is the 1–2 mile ring at midnight: 23,871 trips",
      caption: "The heatmap rises into a terrain. Drag to turn it; height and color both show trips.",
      help: "Three data axes: hour, zone and trips. Height is linear from zero and repeated by color. Hover a column for its exact value." },
    { key: "lines", act: "terrain", icon: "ti-chart-line", actName: "Two rhythms",
      title: "4–8 miles out, 9.5% of the day's trips start in the 1 a.m. hour, the sharpest peak of any ring",
      caption: "Each line is one zone's day as a share of its own trips, so shapes compare despite different sizes.",
      help: "Share of the zone's trips that start in each hour, on one shared scale. The line wraps from 11 p.m. back to midnight." },
  ],
  notes: [
    "<b>Data.</b> 999,033 taxi trips: pickup and drop-off position, starting hour, distance (miles), fare (USD) and riders. The file has no dates or ids, so hours pool every day in it.",
    "<b>Excluded.</b> 967 trips (0.1%) whose pickup or drop-off lies outside the New York area (x 900,000–1,070,000 ft, y 110,000–280,000 ft, coordinates of 0 or far away).",
    "<b>Kept and noted.</b> 7,429 trips with zero miles (average fare $21.32, likely meter or GPS gaps), 7 exact duplicate rows, 1 trip with zero riders.",
    "<b>Coordinates.</b> New York State Plane Long Island, US feet, rounded to 50 ft. Checked against Times Square and JFK.",
    "<b>Zones.</b> Straight-line rings around Times Square by pickup point: under 1, 1–2, 2–4, 4–8 and 8+ miles. Pickups inside the JFK or LaGuardia box count as Airport first. These are approximations, not borough or taxi-zone borders.",
    "<b>Airport trip.</b> Pickup or drop-off inside the JFK or LaGuardia box.",
    "<b>Metrics.</b> Trips = count. Fares = sum of fare. Average fare = fares ÷ trips. Average trip = miles ÷ trips. Shares state their denominator (trips or fares in view).",
    "<b>Titles</b> describe all the data. While a filter is on, the charts and numbers follow it and a note under the title says so.",
    "<b>Built with</b> Mosaic and DuckDB-WASM (the data runs in your browser), D3 for every chart and morph, d3-3d for the terrain, Tabler icons.",
  ],
};

/* ---------- motion settings ---------- */
const SYSTEM_REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let saved = null; try { saved = localStorage.getItem("motion"); } catch {}
let REDUCED = saved ? saved === "off" : SYSTEM_REDUCED;
const T = (ms) => (REDUCED ? 0 : ms);
const TEMPO = 700;                          // seed: brisk
const EASE = d3.easeExpOut;                 // seed: expOut
let quick = false, quickTimer;
const hurry = () => { quick = true; clearTimeout(quickTimer); quickTimer = setTimeout(() => (quick = false), 400); };
const upd = () => T(quick ? 160 : 450);
document.documentElement.classList.toggle("motion-on", !REDUCED);
const motionBtn = document.getElementById("motion");
motionBtn.textContent = REDUCED ? "Motion: off" : "Motion: on";
motionBtn.setAttribute("aria-pressed", String(!REDUCED));
if (REDUCED && SYSTEM_REDUCED) document.getElementById("motionhint").textContent = "Animations are off: your system asks for reduced motion";
motionBtn.onclick = () => { REDUCED = !REDUCED; try { localStorage.setItem("motion", REDUCED ? "off" : "on"); } catch {} location.reload(); };

/* ---------- formats ---------- */
const fmtK = (v) => v >= 1e6 ? d3.format(".2~f")(v / 1e6) + "M" : v >= 1e4 ? d3.format(".0f")(v / 1e3) + "K" : v >= 1e3 ? d3.format(".1~f")(v / 1e3) + "K" : d3.format(",")(Math.round(v));
const fmtInt = d3.format(",");
const fmtMoney = (v) => v >= 1e6 ? "$" + d3.format(".2~f")(v / 1e6) + "M" : v >= 1e3 ? "$" + d3.format(".1~f")(v / 1e3) + "K" : "$" + d3.format(".2f")(v);
const fmtPct = (v) => (v > 0 && v < 0.001 ? "<0.1%" : d3.format(".1f")(v * 100) + "%");
const hourName = (h) => { h = ((h % 24) + 24) % 24; return h === 0 ? "midnight" : h === 12 ? "noon" : h < 12 ? h + " a.m." : (h - 12) + " p.m."; };
const hourShort = (h) => { h = ((h % 24) + 24) % 24; return h === 0 ? "12a" : h === 12 ? "12p" : h < 12 ? h + "a" : (h - 12) + "p"; };
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- tooltip and help ---------- */
const tip = document.getElementById("tip");
function showTip(html, ev) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => (tip.style.opacity = 0);
function wireHelp(root = document) {
  root.querySelectorAll("[data-help]").forEach((el) => {
    if (el.__help) return; el.__help = true;
    el.addEventListener("mouseenter", (e) => showTip(el.dataset.help, e));
    el.addEventListener("mousemove", (e) => showTip(el.dataset.help, e));
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("focus", () => { const b = el.getBoundingClientRect(); showTip(el.dataset.help, { clientX: b.left, clientY: b.bottom }); });
    el.addEventListener("blur", hideTip);
  });
}

/* ---------- DuckDB + Mosaic ---------- */
const connector = vg.wasmConnector();
vg.coordinator().databaseConnector(connector);
// Pre-aggregation needs Plot scale metadata on interval clauses; the D3 map brush has none, and the preaggregator
// then throws inside a swallowed promise and no client updates. Every query here is small, so turn it off.
vg.coordinator().preaggregator.enabled = false;
async function loadTable(name, file) {
  const tag = document.querySelector(`script[type="application/octet-stream"][data-file="${file}"]`);
  if (!tag) return vg.coordinator().exec([vg.loadParquet(name, new URL(file, location.href).href)]);
  const bytes = new Uint8Array(await (await fetch(`data:application/octet-stream;base64,${tag.textContent.trim()}`)).arrayBuffer());
  await (await connector.getDuckDB()).registerFileBuffer(file, bytes);
  await vg.coordinator().exec(`CREATE TABLE "${name}" AS SELECT * FROM read_parquet('${file}')`);
}
const Q = async (sql) => (await vg.coordinator().query(sql)).toArray().map((r) => ({ ...r }));
const num = (v) => (typeof v === "bigint" ? Number(v) : v == null ? 0 : +v);

class Live extends vg.MosaicClient {
  constructor(filterBy, query, render) { super(filterBy); this.q = query; this.r = render; this.ready = new Promise((res) => (this._res = res)); }
  query(where = []) { return this.q(where); }
  queryResult(data) { this.r(data.toArray().map((d) => ({ ...d }))); this._res(); return this; }
  queryError(e) { console.error(e); this._res(); return this; }
}

await loadTable("t", "trips.parquet");

/* reference values computed from the data */
const [ext] = await Q(`SELECT quantile_cont(px,0.0005) x0, quantile_cont(px,0.9995) x1, quantile_cont(py,0.0005) y0, quantile_cont(py,0.9995) y1,
  count(*) n FROM t`);
const ZONES = (await Q(`SELECT zone, count(*) n FROM t GROUP BY zone ORDER BY (zone = 'Airport'), min(sqrt((px-988267)^2+(py-215437)^2))`)).map((d) => d.zone);
const ZCOL = ZONES.map((z, i) => `var(--z${i})`);
const zoneColor = (z) => ZCOL[ZONES.indexOf(z)] || "var(--mark)";
const AIR = "Airport";
// Landmarks and ring centre come from the zone definition in the plan (Times Square, the two airport boxes).
const TSQ = [988267, 215437];
const AIRPORTS = [{ name: "JFK", x: (1035000 + 1056000) / 2, y: (160000 + 185000) / 2 }, { name: "LaGuardia", x: (1012000 + 1026000) / 2, y: (216000 + 228000) / 2 }];
const pad = 0.04 * (ext.x1 - ext.x0);
const X0 = Math.floor(ext.x0 - pad), X1 = Math.ceil(ext.x1 + pad), Y0 = Math.floor(ext.y0 - pad), Y1 = Math.ceil(ext.y1 + pad);
const CELL = 200, NX = Math.ceil((X1 - X0) / CELL), NY = Math.ceil((Y1 - Y0) / CELL);

const $page = vg.Selection.crossfilter();

/* ---------- stage geometry ---------- */
const stageEl = document.getElementById("stage");
const canvas = document.getElementById("map"), ctx = canvas.getContext("2d");
const svg = d3.select("#svg");
const guideLayer = svg.append("g").attr("class", "guides");
const markLayer = svg.append("g").attr("class", "marks");
const mapLayer = svg.append("g").attr("class", "maplayer");
let W = 800, H = 600, DPR = window.devicePixelRatio || 1;
function measure() {

    fareAlloc.forEach((c, zi) => { while (kept[zi] < c && spare.length) { owner[spare.shift()] = zi; kept[zi]++; } });
  }
  const slot = d3.range(owner.length).sort((a, b) => owner[a] - owner[b] || a - b); const pos = []; slot.forEach((sq, k) => (pos[sq] = k));
  const rankIn = []; const seen = Z.map(() => 0); slot.forEach((sq) => (rankIn[sq] = seen[owner[sq]]++));
  const totN = d3.sum(Z, (z) => z.n) || 1, totF = d3.sum(Z, (z) => z.f) || 1;
  if (kind !== "units-fares") {
    const side = Math.min(A.w * 0.62, A.h - 10), s = side / 10, g = Math.max(2, s * 0.12), x0 = A.x + 8, y0 = A.y + (A.h - side) / 2;

  const s = Math.min(rowH * 0.78, (A.w - lab - 150) / Math.max(maxSq, d3.max(Z, (z) => (z.n / totN) * 100)) ), x0 = A.x + lab, y0 = A.y + (A.h - rows * rowH) / 2;

    g.selectAll("circle.pk").data(peaks).join("circle").attr("cx", (d) => x(d.hour) + x.bandwidth() / 2).attr("cy", (d) => y(d.zone) + y.bandwidth() / 2).attr("r", 3).attr("fill", "var(--bg)").attr("stroke", "var(--ink)");
    g.append("text").attr("x", A.x + lab).attr("y", A.y + 16).text("○ each zone's busiest hour · columns are starting hours");
  } else if (key === "terrain") {
    const proj = polygons3D().origin({ x: 0, y: 0 }).scale(1).rotateY(yaw).rotateX(pitch);
    const Hmax = 9; const hgt = (n) => (n / maxN) * Hmax;
    const box = (d) => { const x0 = d.hour - 12, z0 = d.zi * 1.6 - (nz * 1.6) / 2, w = 0.82, dd = 1.25, h = hgt(d.n); const P = (x, y, z) => ({ x, y: -y, z });
      return { front: [P(x0, h, z0 + dd), P(x0 + w, h, z0 + dd), P(x0 + w, 0, z0 + dd), P(x0, 0, z0 + dd)],
        top: [P(x0, h, z0), P(x0 + w, h, z0), P(x0 + w, h, z0 + dd), P(x0, h, z0 + dd)],
        side: [P(x0 + w, h, z0 + dd), P(x0 + w, h, z0), P(x0 + w, 0, z0), P(x0 + w, 0, z0 + dd)] }; };
    // fit: project the bounding box once at scale 1
    const corners = [-12, 12].flatMap((x) => [0, Hmax].flatMap((h) => [-(nz * 1.6) / 2, (nz * 1.6) / 2].map((z) => ({ x, y: -h, z }))));
    const pc = proj([corners])[0].map((v) => [v.projected.x, v.projected.y]);
    const ex = d3.extent(pc, (p) => p[0]), ey = d3.extent(pc, (p) => p[1]);
    const s = Math.min((A.w - 60) / (ex[1] - ex[0]), (A.h - 70) / (ey[1] - ey[0]));
    const ox = A.x + 30 + (A.w - 60 - (ex[1] - ex[0]) * s) / 2 - ex[0] * s, oy = A.y + 20 + (A.h - 70 - (ey[1] - ey[0]) * s) / 2 - ey[0] * s;
    const P2 = (pts) => proj([pts])[0];
    const toScr = (poly) => quad(...poly.map((v) => [ox + v.projected.x * s, oy + v.projected.y * s]));
    const depth = new Map();
    form = (d) => { const b = box(d); const f = P2(b.front), t = P2(b.top), sd = P2(b.side);
      depth.set(d.id, d3.mean(t, (v) => v.rotated.z)); return { front: toScr(f), top: toScr(t), side: toScr(sd), fill: heat(d.n), opacity: 1 }; };
    G.forEach((d) => form(d));
    marks.sort((a, b) => depth.get(a.id) - depth.get(b.id));
    // floor labels
    const lp = (x, z) => { const v = P2([{ x, y: 0, z }])[0]; return [ox + v.projected.x * s, oy + v.projected.y * s]; };
    g.selectAll("text.hx").data(d3.range(0, 24, 3)).join("text").attr("text-anchor", "middle").each(function (h) { const [x, y] = lp(h - 12 + 0.4, (nz * 1.6) / 2 + 1.6); d3.select(this).attr("x", x).attr("y", y + 4); }).text((h) => hourShort(h));
    g.selectAll("text.zx").data(ZONES).join("text").attr("class", "lab").each(function (z, i) { const [x, y] = lp(12.6, i * 1.6 - (nz * 1.6) / 2 + 0.6); d3.select(this).attr("x", x).attr("y", y + 4); }).text((z) => z);
    heatLegend(g, heat, maxN, A.x + 30, A.y + A.h - 22);
    const pk = d3.greatest(G, (d) => d.n);
    if (pk && pk.n) { const b = box(pk); const top = P2(b.top); const [x, y] = [ox + d3.mean(top, (v) => v.projected.x) * s, oy + d3.min(top, (v) => v.projected.y) * s];
      g.append("line").attr("x1", x).attr("x2", x).attr("y1", y - 4).attr("y2", y - 26).attr("stroke", "var(--ink)");
      g.append("text").attr("class", "ann").attr("x", x).attr("y", y - 30).attr("text-anchor", "middle").text(`Highest: ${pk.zone}, ${hourName(pk.hour)} · ${fmtInt(pk.n)}`); }
    g.append("text").attr("x", A.x + A.w - 6).attr("y", A.y + 12).attr("text-anchor", "end").text("Drag to turn · height and color: trips, from zero");
  } else {
    const cols = A.w > 640 ? 3 : 2, rowsN = Math.ceil(nz / cols), gw = (A.w - 20) / cols, gh = (A.h - 30) / rowsN;
    const maxS = d3.max(G, (d) => Math.max(d.share, d.nextShare)) || 0.01;
    form = (d) => { const c = d.zi % cols, r = Math.floor(d.zi / cols); const x0 = A.x + 20 + c * gw + 34, x1 = A.x + 20 + (c + 1) * gw - 14, y0 = A.y + 24 + r * gh, y1 = A.y + 24 + (r + 1) * gh - 34;
      const x = d3.scaleLinear().domain([0, 24]).range([x0, x1]), y = d3.scaleLinear().domain([0, maxS * 1.1]).range([y1, y0]); const t = 1.6;
      return twoD(quad([x(d.hour), y(d.share) - t], [x(d.hour + 1), y(d.nextShare) - t], [x(d.hour + 1), y(d.nextShare) + t], [x(d.hour), y(d.share) + t]), zoneColor(d.zone), 1); };
    for (let zi = 0; zi < nz; zi++) {
      const c = zi % cols, r = Math.floor(zi / cols); const x0 = A.x + 20 + c * gw + 34, x1 = A.x + 20 + (c + 1) * gw - 14, y0 = A.y + 24 + r * gh, y1 = A.y + 24 + (r + 1) * gh - 34;
      const x = d3.scaleLinear().domain([0, 24]).range([x0, x1]), y = d3.scaleLinear().domain([0, maxS * 1.1]).range([y1, y0]);
      const p = g.append("g");
      p.append("g").attr("class", "axis").attr("transform", `translate(0,${y1})`).call(d3.axisBottom(x).tickValues([0, 6, 12, 18, 24]).tickFormat((h) => hourShort(h)).tickSizeOuter(0));
      p.append("g").attr("class", "axis").attr("transform", `translate(${x0},0)`).call(d3.axisLeft(y).ticks(3, ".0%").tickSize(-(x1 - x0))).call((a) => a.select(".domain").remove()).call((a) => a.selectAll(".tick line").attr("stroke", "var(--rule)"));
      p.append("text").attr("class", "lab").attr("x", x0).attr("y", y0 - 6).text(ZONES[zi]);
      const pk = d3.greatest(G.filter((d) => d.zi === zi), (d) => d.share);
      if (pk && pk.share) p.append("text").attr("class", "ann").attr("x", x1).attr("y", y0 - 6).attr("text-anchor", "end").text(`peak ${hourName(pk.hour)}: ${fmtPct(pk.share)}`);
    }
    g.append("text").attr("x", A.x + 20).attr("y", A.y + 6).text("Share of the zone's own trips by starting hour · one shared scale");
  }
  const centres = G.map((d) => bboxC(form(d).front.concat(form(d).top)));
  morph(marks, form, { dur, delay: stagger(centreOut(centres, cx, cy), dur), enter: entering ? enter || ((d, i) => { const c = centres[i]; return twoD(pointP(c[0], c[1]), heat(d.n), 0); }) : undefined });
  marks.style("cursor", key === "terrain" ? "grab" : null)
    .on("mouseenter mousemove", (ev, d) => showTip(`<b>${d.zone} · ${hourName(d.hour)}</b><br>${fmtInt(d.n)} trips<br>${fmtPct(d.share)} of the zone's trips<br><span class="m">Pickup zone × starting hour</span>`, ev))
    .on("mouseleave", hideTip).on("click", null);
}
function heatLegend(g, heat, maxN, x, y) {
  const w = 160, n = 24, l = g.append("g").attr("transform", `translate(${x},${y})`);
  l.selectAll("rect").data(d3.range(n)).join("rect").attr("x", (i) => (i * w) / n).attr("width", w / n + 0.5).attr("height", 8).attr("fill", (i) => heat(((i + 0.5) / n) * maxN));
  l.append("text").attr("x", 0).attr("y", 21).text("0"); l.append("text").attr("x", w).attr("y", 21).attr("text-anchor", "end").text(fmtK(maxN) + " trips");
  l.append("text").attr("x", w + 10).attr("y", 8).text("linear");
}
// drag to rotate the terrain (no transition while dragging)
svg.call(d3.drag().filter((ev) => SCENES[state.scene].key === "terrain" && !ev.target.closest(".maplayer"))
  .on("drag", (ev) => { yaw = Math.max(-1.4, Math.min(1.4, yaw + ev.dx * 0.008)); pitch = Math.max(-1.2, Math.min(-0.15, pitch - ev.dy * 0.006)); renderTerrain("terrain", 0, false); }));

/* ---------- scene engine ---------- */
let current = { act: null };
function collapseAct(act, dur) {
  const cls = { share: "sq", clock: "hr", terrain: "cell" }[act]; if (!cls) return;
  const sel = markLayer.selectAll("g." + cls); if (sel.empty()) return;
  sel.each(function () {
    const g = d3.select(this);
    for (const face of ["side", "top", "front"]) {
      const path = g.select("." + face), node = path.node(); if (!node.__pts) continue;
      const c = bboxC(node.__pts), to = pointP(c[0], c[1] + 0);
      path.transition("geo").duration(dur).ease(d3.easeCubicIn)
        .attrTween("d", function () { const ip = d3.interpolateArray(this.__pts, to); return (k) => toPath((this.__pts = ip(k))); });
      path.transition("paint").duration(dur).attr("opacity", 0);
    }
    g.style("pointer-events", "none");
  });
}
function mapTo(full, dur) {
  const target = full ? { ...fullBox(), inset: 0 } : { ...insetBox(), inset: 1 };
  const from = frame || target;
  if (!dur) { frame = target; drawMap(); return; }
  const ip = d3.interpolateObject(from, target);
  d3.select(canvas).transition("frame").duration(dur).ease(d3.easeCubicInOut).tween("frame", () => (t) => { frame = ip(t); drawMap(); });
}
function renderScene(entering, dur = upd()) {
  const sc = SCENES[state.scene];
  if (sc.act === "city") {
    newGuides(dur);
  } else if (sc.act === "share") { if (state.zones.length) renderShare(sc.key, dur, entering); }
  else if (sc.act === "clock") { if (state.hours.length) renderClock(sc.key, dur, entering); }
  else if (sc.act === "terrain") { if (state.grid.length) renderTerrain(sc.key, dur, entering); }
}
function showScene(i, { fromScroll = false } = {}) {
  i = Math.max(0, Math.min(SCENES.length - 1, i));
  const sc = SCENES[i], prevAct = current.act, dur = T(TEMPO);
  state.scene = i;
  document.getElementById("title").textContent = sc.title;
  document.getElementById("sceneicon").className = "ti " + sc.icon;
  const th = document.getElementById("titlehelp"); th.dataset.help = sc.help; th.__help = false; wireHelp(th.parentElement);
  document.getElementById("scenecount").textContent = `Scene ${i + 1} of ${SCENES.length} · ${sc.actName}`;
  cards.classed("on", (d, k) => k === i);
  try { history.replaceState(null, "", "#" + sc.key); } catch {}
  if (prevAct !== sc.act) {
    lensCircle.attr("display", "none"); lensWanted = null; if (state.lens) { state.lens = null; if (state.mapBins) paintBins(); } hideTip();
    if (prevAct) collapseAct(prevAct, T(TEMPO * 0.6));
    mapTo(sc.act === "city", T(TEMPO));
    setTimeout(() => renderScene(true, dur), prevAct ? T(TEMPO * 0.25) : 0);
  } else renderScene(false, dur);
  current.act = sc.act;
  drawHand();
  if (!fromScroll) scrollToCard(i);
  document.getElementById("prev").disabled = i === 0; document.getElementById("next").disabled = i === SCENES.length - 1;
}

/* ---------- scene cards (scrolly-split) ---------- */
const cardsEl = document.getElementById("cards");
const cards = d3.select(cardsEl).selectAll("article").data(SCENES).join("article").attr("class", "card").attr("tabindex", 0)
  .attr("aria-label", (d, i) => `Scene ${i + 1}: ${d.title}`)
  .html((d, i) => `<div class="act"><i class="ti ${d.icon}" aria-hidden="true"></i>${i + 1} · ${d.actName}</div><h3>${d.title}</h3><p>${d.caption}</p>`)
  .on("click", (ev, d) => { stopAuto(); showScene(SCENES.indexOf(d)); })
  .on("keydown", (ev, d) => { if (ev.key === "Enter") { stopAuto(); showScene(SCENES.indexOf(d)); } });
let suppress = 0, userScroll = 0;
for (const ev of ["wheel", "touchmove", "pointerdown", "keydown"]) cardsEl.addEventListener(ev, () => (userScroll = performance.now() + 1500), { passive: true });
function scrollToCard(i) { suppress = performance.now() + 900; const el = cardsEl.children[i]; if (el) cardsEl.scrollTo({ top: el.offsetTop - cardsEl.clientHeight / 2 + el.clientHeight / 2, behavior: REDUCED ? "auto" : "smooth" }); }
const io = new IntersectionObserver((entries) => {
  if (performance.now() < suppress || performance.now() > userScroll) return;
  for (const e of entries) if (e.isIntersecting) { const i = [...cardsEl.children].indexOf(e.target); if (i !== state.scene) { stopAuto(); showScene(i, { fromScroll: true }); } }
}, { root: cardsEl, rootMargin: "-45% 0px -45% 0px", threshold: 0 });

/* ---------- navigation ---------- */
let autoTimer = null; const autoBtn = document.getElementById("auto");
function stopAuto() { if (!autoTimer) return; clearTimeout(autoTimer); autoTimer = null; autoBtn.setAttribute("aria-pressed", "false"); }
function autoStep() { const sc = SCENES[state.scene]; const hold = 4000 + 300 * (sc.title + " " + sc.caption).split(/\s+/).length;
  autoTimer = setTimeout(() => { if (state.scene >= SCENES.length - 1) { stopAuto(); return; } showScene(state.scene + 1); autoStep(); }, hold); }
autoBtn.onclick = () => { if (autoTimer) stopAuto(); else { autoBtn.setAttribute("aria-pressed", "true"); autoStep(); } };
document.getElementById("prev").onclick = () => { stopAuto(); showScene(state.scene - 1); };
document.getElementById("next").onclick = () => { stopAuto(); showScene(state.scene + 1); };
addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); stopAuto(); showScene(state.scene + 1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); stopAuto(); showScene(state.scene - 1); }
  if (e.key === " ") { e.preventDefault(); autoBtn.click(); }
  if (e.key === "Escape") document.getElementById("drawer").classList.remove("open");

let touch0 = null;
stageEl.addEventListener("touchstart", (e) => (touch0 = e.touches[0]), { passive: true });
stageEl.addEventListener("touchend", (e) => { if (!touch0 || SCENES[state.scene].act === "city") return; const dx = e.changedTouches[0].clientX - touch0.clientX; if (Math.abs(dx) > 60) showScene(state.scene + (dx < 0 ? 1 : -1)); touch0 = null; });
document.getElementById("notes").innerHTML = PLAN.notes.map((n) => `<li>${n}</li>`).join("");
document.getElementById("notesbtn").onclick = () => document.getElementById("drawer").classList.toggle("open");

wireHelp();

/* ---------- resize ---------- */
let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => { measure(); frame = null; mapTo(SCENES[state.scene].act === "city", 0); renderScene(false, 0); }, 120); }).observe(stageEl);

/* ---------- start after the first data ---------- */
const clients = [kpiClient, totalClient, zoneClient, hourClient, gridClient, mapClient];
clients.forEach((c) => vg.coordinator().connect(c));
await Promise.all(clients.map((c) => c.ready));
document.getElementById("loading").remove();
const startKey = location.hash.slice(1);
const start = Math.max(0, SCENES.findIndex((s) => s.key === startKey));
[...cardsEl.children].forEach((c) => io.observe(c));
showScene(start);
describeFilters();
window.__dash = { showScene, SCENES, $page, kpiClient, mapClient, state };
</script>
